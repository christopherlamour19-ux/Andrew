<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Moto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0B0F19;
            --bg-card: #151C2C;
            --accent: #FFB300;
            --accent-hover: #FFA000;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            position: fixed;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo i { color: var(--accent); }
        .logo span { color: var(--accent); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-nav-btn {
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .auth-nav-btn:hover { background: var(--accent-hover); }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 5% 40px 5%;
            background: radial-gradient(circle at 50% 25%, rgba(255, 179, 0, 0.06), transparent 60%);
            min-height: calc(100vh - 70px);
            margin-top: 70px;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .hero h1 span { color: var(--accent); }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            max-width: 650px;
        }

        .main-modes {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .mode-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
        }

        .search-container, .simulator-form, .auth-container, .dashboard-container {
            width: 100%;
            max-width: 750px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 30px;
            text-align: left;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin: 0 auto;
            display: none;
        }

        .search-container {
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
        }

        .search-box {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            padding: 8px;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s;
        }

        .search-box:focus-within { border-color: var(--accent); }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .search-box button, .auth-submit-btn {
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            padding: 0 35px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-submit-btn { width: 100%; padding: 15px; margin-top: 10px; }
        .search-box button:hover, .auth-submit-btn:hover { background: var(--accent-hover); }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group select, .form-group input {
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .form-group select:focus, .form-group input:focus { border-color: var(--accent); }

        .auth-switch {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-switch span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        .history-item {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.5);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.reload()">
            <i class="fa-solid fa-motorcycle"></i> Radar <span>Moto</span>
        </div>
        <div class="nav-right">
            <button class="auth-nav-btn" id="navAuthBtn" onclick="openAuthModal()">Mon Compte</button>
        </div>
    </nav>

    <div class="hero">
        <h1>Analysez et Estimez <span>votre Moto</span></h1>
        <p>Entrez l'annonce ou utilisez le simulateur pour obtenir une analyse complète.</p>

        <div class="main-modes">
            <button class="mode-btn active" id="btnModeSearch" onclick="switchMode('search')">
                <i class="fa-solid fa-magnifying-glass"></i> Analyse d'annonce
            </button>
            <button class="mode-btn" id="btnModeSim" onclick="switchMode('sim')">
                <i class="fa-solid fa-calculator"></i> Simulateur
            </button>
        </div>

        <!-- Recherche d'annonce -->
        <div class="search-container" id="searchContainer" style="display: block;">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Collez le lien de l'annonce (Leboncoin, etc.)...">
                <button onclick="lancerAnalyse()">Analyser <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>

        <!-- Simulateur (Conservé intact) -->
        <div class="simulator-form" id="simulatorForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Modèle de moto</label>
                    <input type="text" placeholder="Ex: Yamaha MT-07">
                </div>
                <div class="form-group">
                    <label>Année</label>
                    <input type="number" placeholder="Ex: 2021">
                </div>
            </div>
            <button class="sim-submit-btn" onclick="lancerSimulation()">Lancer la simulation</button>
        </div>

        <!-- Espace Connexion / Inscription -->
        <div class="auth-container" id="authContainer">
            <h2 id="authTitle" style="margin-bottom: 20px; color: var(--text-main);">Connexion</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="authEmail" required placeholder="votre@email.com">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="authPassword" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="auth-submit-btn" id="authSubmitText">Se connecter</button>
            </form>
            <div class="auth-switch">
                <span id="authSwitchText" onclick="toggleAuthMode()">Pas encore de compte ? S'inscrire</span>
            </div>
        </div>

        <!-- Tableau de bord / Historique -->
        <div class="dashboard-container" id="dashboardContainer">
            <h2 style="margin-bottom: 10px;">Mon Compte</h2>
            <p id="userEmailDisplay" style="color: var(--text-muted); margin-bottom: 20px;"></p>
            
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Mon historique de recherches</h3>
            <div id="historyList" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px;">
                <!-- Les recherches s'afficheront ici -->
            </div>
            
            <button class="auth-submit-btn" style="background: #ef4444; color: white;" onclick="deconnecter()">Se déconnecter</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Radar Moto. Tous droits réservés.</p>
    </footer>

    <script>
        let isRegisterMode = false;

        function switchMode(mode) {
            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('simulatorForm').style.display = 'none';
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'none';

            document.getElementById('btnModeSearch').classList.remove('active');
            document.getElementById('btnModeSim').classList.remove('active');

            if (mode === 'search') {
                document.getElementById('searchContainer').style.display = 'block';
                document.getElementById('btnModeSearch').classList.add('active');
            } else if (mode === 'sim') {
                document.getElementById('simulatorForm').style.display = 'block';
                document.getElementById('btnModeSim').classList.add('active');
            }
        }

        function openAuthModal() {
            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('simulatorForm').style.display = 'none';
            document.getElementById('btnModeSearch').classList.remove('active');
            document.getElementById('btnModeSim').classList.remove('active');

            const currentUser = localStorage.getItem('radar_current_user');
            if (currentUser) {
                afficherDashboard(currentUser);
            } else {
                document.getElementById('authContainer').style.display = 'block';
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? "Inscription" : "Connexion";
            document.getElementById('authSubmitText').innerText = isRegisterMode ? "Créer un compte" : "Se connecter";
            document.getElementById('authSwitchText').innerText = isRegisterMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            let users = JSON.parse(localStorage.getItem('radar_users')) || {};

            if (isRegisterMode) {
                if (users[email]) {
                    alert("Cet email possède déjà un compte.");
                    return;
                }
                users[email] = { password: password, history: [] };
                localStorage.setItem('radar_users', JSON.stringify(users));
                alert("Compte créé avec succès !");
            } else {
                if (!users[email] || users[email].password !== password) {
                    alert("Email ou mot de passe incorrect.");
                    return;
                }
            }

            localStorage.setItem('radar_current_user', email);
            afficherDashboard(email);
        }

        function afficherDashboard(email) {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'block';
            document.getElementById('userEmailDisplay').innerText = `Connecté en tant que : ${email}`;

            let users = JSON.parse(localStorage.getItem('radar_users')) || {};
            let userHistory = users[email]?.history || [];
            let historyList = document.getElementById('historyList');

            if (userHistory.length === 0) {
                historyList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">Aucune recherche effectuée pour le moment.</p>`;
            } else {
                historyList.innerHTML = userHistory.map(item => `
                    <div class="history-item">
                        <span style="font-size: 0.9rem; word-break: break-all; color: white;">${item}</span>
                    </div>
                `).join('');
            }
        }

        function deconnecter() {
            localStorage.removeItem('radar_current_user');
            switchMode('search');
        }

        function lancerAnalyse() {
            const inputVal = document.getElementById('searchInput').value.trim();
            if (!inputVal) {
                alert("Veuillez entrer un lien ou un texte d'annonce.");
                return;
            }

            // Sauvegarde dans l'historique de l'utilisateur connecté
            const currentUser = localStorage.getItem('radar_current_user');
            if (currentUser) {
                let users = JSON.parse(localStorage.getItem('radar_users')) || {};
                if (users[currentUser]) {
                    if (!users[currentUser].history) users[currentUser].history = [];
                    users[currentUser].history.unshift(inputVal); // Ajoute au début
                    localStorage.setItem('radar_users', JSON.stringify(users));
                }
            }

            alert("Analyse lancée avec succès ! (Enregistrée dans votre historique si connecté)");
        }

        function lancerSimulation() {
            alert("Simulation lancée !");
        }
    </script>
</body>
</html>

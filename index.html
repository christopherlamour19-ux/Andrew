<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Moto - Simulateur & Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0F19;
            --bg-card: #151C2C;
            --accent: #FFB300;
            --accent-hover: #FFA000;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(15px); position: fixed; width: 100%; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo span { color: var(--accent); }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .auth-nav-btn { background: var(--accent); color: var(--bg-dark); border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: background 0.3s; }
        .auth-nav-btn:hover { background: var(--accent-hover); }

        .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 100px 5% 40px 5%; background: radial-gradient(circle at 50% 25%, rgba(255, 179, 0, 0.06), transparent 60%); min-height: calc(100vh - 70px); margin-top: 70px; }
        .hero h1 { font-size: 3.2rem; font-weight: 800; margin-bottom: 15px; letter-spacing: -1px; line-height: 1.2; }
        .hero h1 span { color: var(--accent); }
        .hero p { font-size: 1.15rem; color: var(--text-muted); margin-bottom: 25px; max-width: 650px; }

        .main-modes { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .mode-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 12px 25px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .mode-btn.active { background: var(--accent); color: var(--bg-dark); border-color: var(--accent); }

        .simulator-form, .auth-container { width: 100%; max-width: 750px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 30px; text-align: left; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin: 0 auto; display: none; }
        .simulator-form.active, .auth-container.active { display: block; }

        .form-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        .form-group select, .form-group input { background: rgba(11, 15, 25, 0.8); border: 1px solid var(--border-color); padding: 12px 15px; border-radius: 10px; color: white; font-size: 0.95rem; outline: none; width: 100%; }
        .form-group select:focus, .form-group input:focus { border-color: var(--accent); }

        .sim-submit-btn, .auth-submit-btn { width: 100%; background: var(--accent); color: var(--bg-dark); border: none; padding: 15px; font-size: 1rem; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .sim-submit-btn:hover, .auth-submit-btn:hover { background: var(--accent-hover); }

        .auth-switch { text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-switch span { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; }

        .simulator-result { width: 100%; max-width: 750px; display: none; text-align: left; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin: 20px auto 0 auto; overflow: hidden; padding: 25px; }
        .error-message { color: #ef4444; font-weight: 500; background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.3); }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .main-modes { flex-direction: column; width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showSection('simulator')">
            <span>⚡</span> Moto IA
        </div>
        <div class="nav-right">
            <button class="auth-nav-btn" onclick="showSection('auth')">Connexion / Inscription</button>
        </div>
    </nav>

    <div class="hero">
        <h1>Trouvez votre <span>Moto Idéale</span></h1>
        <p>Laissez notre IA analyser vos besoins pour trouver la machine parfaite.</p>

        <div class="main-modes">
            <button class="mode-btn active" id="btn-mode-sim" onclick="showSection('simulator')">Simulateur de profil</button>
        </div>

        <!-- 1. SECTION SIMULATEUR -->
        <div class="simulator-form active" id="section-simulator">
            <form id="sim-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Niveau d'expérience</label>
                        <select id="sim-exp" required>
                            <option value="debutant">Débutant (Permis A2)</option>
                            <option value="intermediaire">Intermédiaire (1-3 ans)</option>
                            <option value="expert">Expert (Permis A, >3 ans)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Budget maximum (€)</label>
                        <input type="number" id="sim-budget" placeholder="Ex: 6500" required>
                    </div>
                </div>
                <button type="submit" class="sim-submit-btn" id="sim-btn">Trouver ma moto idéale</button>
            </form>
        </div>

        <!-- RÉSULTAT DU SIMULATEUR (SANS PHOTO) -->
        <div class="simulator-result" id="sim-result-box">
            <div id="sim-result-content"></div>
        </div>

        <!-- 2. SECTION CONNEXION / INSCRIPTION -->
        <div class="auth-container" id="section-auth">
            <h2 id="auth-title" style="margin-bottom: 20px; font-size: 1.5rem;">Connexion à votre compte</h2>
            <form id="auth-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="votre@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="auth-submit-btn" id="auth-btn">Se connecter</button>
            </form>
            <div class="auth-switch" id="auth-switch-text">
                Pas encore de compte ? <span onclick="toggleAuthMode()">S'inscrire</span>
            </div>
        </div>

    </div>

    <script>
        function showSection(sectionId) {
            document.getElementById('section-simulator').classList.remove('active');
            document.getElementById('section-auth').classList.remove('active');
            document.getElementById('sim-result-box').style.display = 'none';

            if(sectionId === 'simulator') {
                document.getElementById('section-simulator').classList.add('active');
                document.getElementById('btn-mode-sim').classList.add('active');
            } else if (sectionId === 'auth') {
                document.getElementById('section-auth').classList.add('active');
                document.getElementById('btn-mode-sim').classList.remove('active');
            }
        }

        let isLogin = true;
        function toggleAuthMode() {
            isLogin = !isLogin;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('auth-btn');
            const switchText = document.getElementById('auth-switch-text');

            if (isLogin) {
                title.innerText = "Connexion à votre compte";
                btn.innerText = "Se connecter";
                switchText.innerHTML = 'Pas encore de compte ? <span onclick="toggleAuthMode()">S\'inscrire</span>';
            } else {
                title.innerText = "Créer un compte";
                btn.innerText = "S'inscrire";
                switchText.innerHTML = 'Déjà un compte ? <span onclick="toggleAuthMode()">Se connecter</span>';
            }
        }

        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert(isLogin ? "Fonction de connexion à relier à ton backend." : "Fonction d'inscription à relier à ton backend.");
        });

        document.getElementById('sim-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('sim-btn');
            const resultBox = document.getElementById('sim-result-box');
            const resultContent = document.getElementById('sim-result-content');
            
            const experience = document.getElementById('sim-exp').value;
            const budget = document.getElementById('sim-budget').value;

            btn.innerText = "Analyse en cours...";
            btn.disabled = true;
            resultBox.style.display = 'none';
            resultContent.innerHTML = "";

            try {
                const response = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ experience, budget })
                });

                const responseText = await response.text(); 
                let data;
                
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    throw new Error(`Le serveur a renvoyé une erreur non formatée : ${responseText.substring(0, 80)}...`);
                }

                if (!response.ok) {
                    throw new Error(data.error || "Erreur lors de la simulation.");
                }

                // Affichage du résultat textuel uniquement (aucune balise <img> ajoutée)
                resultContent.innerHTML = `<h3 style="color:var(--accent); margin-bottom:10px;">Résultat :</h3><p>${data.result || data.message || "Moto trouvée avec succès !"}</p>`;
                resultBox.style.display = 'block';

            } catch (error) {
                resultContent.innerHTML = `<div class="error-message">❌ <b>Erreur:</b> ${error.message}</div>`;
                resultBox.style.display = 'block';
            } finally {
                btn.innerText = "Trouver ma moto idéale";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

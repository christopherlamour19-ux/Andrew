<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadarMoto | Trouve ta moto idéale</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0B0F19;
            --bg-card: #151C2C;
            --accent: #FFB300;
            --accent-hover: #FFA000;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            position: fixed;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i { color: var(--accent); }
        .logo span { color: var(--accent); }

        .nav-badge {
            background: rgba(255, 179, 0, 0.1);
            color: var(--accent);
            border: 1px solid rgba(255, 179, 0, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 130px 5% 60px 5%;
            background: radial-gradient(circle at 50% 25%, rgba(255, 179, 0, 0.06), transparent 60%);
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .hero h1 span { color: var(--accent); }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 650px;
        }

        /* --- FORMULAIRE DE PROFIL --- */
        .form-container {
            width: 100%;
            max-width: 750px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: left;
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: #334155;
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* --- ZONE DE RÉSULTAT AVEC ONGLETS --- */
        .result-container {
            width: 100%;
            max-width: 750px;
            display: none;
            text-align: left;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease;
            margin-bottom: 40px;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tabs-header {
            display: flex;
            background: rgba(11, 15, 25, 0.6);
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.02);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            background: rgba(255, 179, 0, 0.03);
        }

        .tab-content {
            display: none;
            padding: 25px;
            color: #E2E8F0;
            line-height: 1.8;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .tab-content.active { display: block; }
        .error-box { border-color: rgba(239, 68, 68, 0.4) !important; }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(11, 15, 25, 0.3);
            border-radius: 50%;
            border-top-color: var(--bg-dark);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.5);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <i class="fa-solid fa-motorcycle"></i> Radar<span>Moto</span>
        </div>
        <div class="nav-badge">christo.r7 le best</div>
    </nav>

    <section class="hero">
        <h1>Trouve ta <span>Moto Idéale</span></h1>
        <p>Renseigne ton profil et tes critères pour laisser l'IA te recommander la moto parfaite pour toi.</p>

        <div class="form-container">
            <form id="recommendation-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="age">Ton âge :</label>
                        <input type="number" id="age" placeholder="ex: 22" required min="14" max="99">
                    </div>

                    <div class="form-group">
                        <label for="height">Ta taille (en cm) :</label>
                        <input type="number" id="height" placeholder="ex: 178" required min="130" max="220">
                    </div>

                    <div class="form-group">
                        <label for="license">Type de permis :</label>
                        <select id="license" required>
                            <option value="A2">Permis A2</option>
                            <option value="A">Permis A (Full)</option>
                            <option value="125cc / Permis B">125cc / Permis B</option>
                            <option value="En cours d'obtention">En cours d'obtention</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="experience">Depuis quand as-tu le permis ?</label>
                        <input type="text" id="experience" placeholder="ex: Débutant / Depuis 6 mois / 2 ans" required>
                    </div>

                    <div class="form-group">
                        <label for="style">Style de moto préféré :</label>
                        <select id="style" required>
                            <option value="Roadster">Roadster</option>
                            <option value="Sportive">Sportive</option>
                            <option value="Trail / Crossover">Trail / Crossover</option>
                            <option value="Neo-Rétro / Custom">Néo-Rétro / Custom</option>
                            <option value="Atypique / Tout style">Peu importe / Je veux le meilleur choix</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="budget">Budget max (achat) :</label>
                        <input type="text" id="budget" placeholder="ex: 5000€" required>
                    </div>

                    <div class="form-group">
                        <label for="insurance">Priorité Assurance :</label>
                        <select id="insurance" required>
                            <option value="Peu importe / Budget large">Peu importe</option>
                            <option value="Économique obligatoire (jeune permis)">Économique (jeune permis)</option>
                            <option value="Modérée">Modérée</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="consumption">Consommation / Usage :</label>
                        <input type="text" id="consumption" placeholder="ex: Trajets quotidiens, sobre / Balade week-end" required>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">
                    <span id="btn-text">Calculer ma moto idéale</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Conteneur des résultats par onglets -->
        <div class="result-container" id="result-container">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('top-pick')">
                    <i class="fa-solid fa-trophy"></i> Le Coup de Cœur (Top 1)
                </button>
                <button class="tab-btn" onclick="switchTab('alternatives')">
                    <i class="fa-solid fa-list-check"></i> Alternatives & Conseils
                </button>
            </div>

            <div id="tab-top-pick" class="tab-content active"></div>
            <div id="tab-alternatives" class="tab-content"></div>
        </div>
    </section>

    <footer>
        &copy; 2026 RadarMoto. Outil d'aide à l'achat de motos d'occasion.
    </footer>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'top-pick') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('tab-top-pick').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('tab-alternatives').classList.add('active');
            }
        }

        document.getElementById('recommendation-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const profileData = {
                age: document.getElementById('age').value,
                height: document.getElementById('height').value,
                license: document.getElementById('license').value,
                experience: document.getElementById('experience').value,
                style: document.getElementById('style').value,
                budget: document.getElementById('budget').value,
                insurance: document.getElementById('insurance').value,
                consumption: document.getElementById('consumption').value
            };

            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');
            const resultContainer = document.getElementById('result-container');
            const topPickBox = document.getElementById('tab-top-pick');
            const alternativesBox = document.getElementById('tab-alternatives');

            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            resultContainer.style.display = 'none';
            resultContainer.classList.remove('error-box');

            const steps = [
                "Analyse de ta morphologie...",
                "Vérification des critères permis/assurance...",
                "Recherche de la perle rare..."
            ];
            
            let stepIdx = 0;
            btnText.textContent = steps[0];
            
            const interval = setInterval(() => {
                stepIdx++;
                if (stepIdx < steps.length) {
                    btnText.textContent = steps[stepIdx];
                }
            }, 1200);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profile: profileData })
                });

                clearInterval(interval);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erreur lors du calcul.');
                }

                const fullText = data.result;
                let topPickPart = fullText;
                let alternativesPart = "Alternatives non disponibles.";

                if (fullText.includes("---TOP_PICK---") && fullText.includes("---ALTERNATIVES---")) {
                    const parts = fullText.split("---ALTERNATIVES---");
                    topPickPart = parts[0].replace("---TOP_PICK---", "").trim();
                    alternativesPart = parts[1].trim();
                }

                topPickBox.textContent = topPickPart;
                alternativesBox.textContent = alternativesPart;
                
                resultContainer.style.display = 'block';
                switchTab('top-pick');

            } catch (error) {
                clearInterval(interval);
                resultContainer.classList.add('error-box');
                topPickBox.textContent = "Erreur : " + error.message;
                alternativesBox.textContent = "Impossible de générer les recommandations.";
                resultContainer.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "Calculer ma moto idéale";
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>

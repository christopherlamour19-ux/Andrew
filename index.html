<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCheck IA - Analyseur d'annonces</title>
    <style>
        /* === RESET & BASE === */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Bleu nuit très sombre */
            color: #f8fafc; /* Texte presque blanc */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* === CONTENEUR PRINCIPAL === */
        .container {
            background-color: #1e293b; /* Bleu gris pour le bloc central */
            width: 100%;
            max-width: 650px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        /* === EN-TÊTE === */
        h1 {
            text-align: center;
            color: #38bdf8; /* Bleu clair dynamique */
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* === FORMULAIRE === */
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        textarea {
            width: 100%;
            background-color: #0b1120;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 1rem;
            font-size: 1rem;
            min-height: 120px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* === BOUTON === */
        button {
            width: 100%;
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #0284c7;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        /* === ÉTATS & RÉSULTATS === */
        #loader {
            display: none;
            text-align: center;
            margin-top: 1.5rem;
            color: #38bdf8;
            font-weight: 500;
            font-size: 1.1rem;
        }

        #result-box {
            display: none;
            margin-top: 2rem;
            background-color: #1e293b;
            border-left: 5px solid #10b981; /* Ligne verte pour le succès */
            padding: 1.5rem;
            border-radius: 0 8px 8px 0;
            white-space: pre-wrap; /* Permet de garder les retours à la ligne de l'IA */
            line-height: 1.6;
            color: #e2e8f0;
            background: linear-gradient(to right, #0f172a, #1e293b);
        }

        .error-box {
            border-left: 5px solid #ef4444 !important; /* Ligne rouge pour les erreurs */
            color: #fca5a5 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏍️ MotoCheck IA</h1>
        <p class="subtitle">L'expert virtuel pour tes achats de motos d'occasion.</p>

        <form id="analyze-form">
            <label for="prompt">Lien LeBonCoin ou description de l'annonce :</label>
            <textarea id="prompt" placeholder="https://www.leboncoin.fr/ad/motos/123456789..." required></textarea>
            <button type="submit" id="submit-btn">Lancer l'analyse IA</button>
        </form>

        <div id="loader">⚙️ Démontage du moteur en cours... Analyse de l'annonce...</div>
        
        <div id="result-box"></div>
    </div>

    <script>
        document.getElementById('analyze-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const promptInput = document.getElementById('prompt').value;
            const submitBtn = document.getElementById('submit-btn');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('result-box');

            // Mise à jour de l'interface pour l'attente
            submitBtn.disabled = true;
            submitBtn.textContent = "Analyse en cours...";
            loader.style.display = 'block';
            resultBox.style.display = 'none';
            resultBox.classList.remove('error-box');

            try {
                // Appel vers ton backend Vercel
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptInput })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erreur lors de la communication avec le serveur.');
                }

                // Affichage du résultat
                resultBox.textContent = data.result;
                resultBox.style.display = 'block';

            } catch (error) {
                // Affichage de l'erreur
                resultBox.textContent = "⚠️ Erreur : " + error.message;
                resultBox.classList.add('error-box');
                resultBox.style.display = 'block';
            } finally {
                // Remise à zéro de l'interface
                submitBtn.disabled = false;
                submitBtn.textContent = "Lancer l'analyse IA";
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadarMoto | L'expert pour vos achats moto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #070a13;
            --bg-card: rgba(21, 28, 44, 0.65);
            --accent: #FFB300;
            --accent-hover: #ffc133;
            --accent-glow: rgba(255, 179, 0, 0.4);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative; }

        .bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.6; animation: float 12s infinite ease-in-out alternate; }
        .orb-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: rgba(255, 179, 0, 0.15); }
        .orb-2 { bottom: -10%; right: -5%; width: 600px; height: 600px; background: rgba(0, 110, 255, 0.12); animation-delay: -5s; }
        .orb-3 { top: 40%; left: 40%; width: 400px; height: 400px; background: rgba(255, 0, 102, 0.08); animation-duration: 15s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(7, 10, 19, 0.7); backdrop-filter: blur(20px); position: fixed; width: 100%; z-index: 100; border-bottom: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .logo-container { display: flex; align-items: center; gap: 20px; }
        .logo { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo i { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }
        .logo span { background: linear-gradient(135deg, #FFB300, #ff6a00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-badge { background: rgba(255, 179, 0, 0.1); color: var(--accent); border: 1px solid rgba(255, 179, 0, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: none; }
        .auth-nav { display: flex; align-items: center; gap: 15px; }

        .nav-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 179, 0, 0.5); color: var(--accent); padding: 8px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
        .nav-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); transform: translateY(-2px); }
        
        .user-greeting { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); display: none; }
        .user-greeting span { color: var(--text-main); }

        .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 140px 5% 60px 5%; z-index: 10; }
        .hero h1 { font-size: 3.2rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; line-height: 1.2; }
        .hero h1 span { background: linear-gradient(135deg, #FFB300, #ff5e00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.15rem; color: var(--text-muted); margin-bottom: 35px; max-width: 650px; line-height: 1.6; }

        /* SÉLECTEUR DE MODES */
        .main-modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 40px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 16px; border: 1px solid var(--border-color); backdrop-filter: blur(10px); }
        .mode-btn { background: transparent; border: none; color: var(--text-muted); padding: 10px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .mode-btn:hover { color: white; }
        .mode-btn.active { background: var(--accent); color: #000; box-shadow: 0 5px 15px var(--accent-glow); transform: scale(1.02); }

        .glass-panel { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); width: 100%; max-width: 750px; }

        .search-container { width: 100%; max-width: 750px; margin-bottom: 15px; }
        .search-box { display: flex; padding: 10px; }
        .search-box input { flex: 1; background: transparent; border: none; padding: 15px 20px; color: white; font-size: 1rem; outline: none; }
        .search-box input::placeholder { color: var(--text-muted); }
        
        .search-box button, .sim-submit-btn, .submit-btn {
            background: linear-gradient(135deg, #FFB300, #F59E0B);
            color: #000; border: none; padding: 0 30px; font-size: 1rem; font-weight: 700;
            border-radius: 10px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .search-box button:hover, .sim-submit-btn:hover, .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }

        .sample-hint { font-size: 0.9rem; color: var(--text-muted); margin-top: 15px; margin-bottom: 40px; }
        .sample-hint span { color: var(--accent); cursor: pointer; font-weight: 500; border-bottom: 1px dashed var(--accent); }

        .simulator-form { display: none; padding: 35px; text-align: left; margin-bottom: 40px; }
        .form-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; color: #cbd5e1; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .form-group label i { color: var(--accent); }
        
        .form-group select, .form-group input {
            background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); padding: 14px 15px;
            border-radius: 10px; color: white; font-size: 0.95rem; outline: none; width: 100%; transition: 0.3s;
        }
        .form-group select:focus, .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 179, 0, 0.2); }
        .sim-submit-btn { width: 100%; padding: 18px; font-size: 1.05rem; }

        .result-container, .simulator-result, .duel-results-wrapper, .argus-result { display: none; text-align: left; margin-bottom: 40px; animation: slideUpFade 0.5s ease forwards; opacity: 0; transform: translateY(20px); width: 100%; max-width: 750px; }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        .tabs-header { display: flex; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 18px; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab-btn.active { color: var(--accent); background: linear-gradient(to top, rgba(255, 179, 0, 0.05), transparent); }
        .tab-content { display: none; padding: 30px; color: #E2E8F0; line-height: 1.8; font-size: 1rem; white-space: pre-wrap; }
        .tab-content.active { display: block; }

        .duel-results-wrapper { max-width: 1100px; gap: 20px; }
        .duel-result { flex: 1; min-width: 300px; }

        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(0, 0, 0, 0.2); border-radius: 50%; border-top-color: #000; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); padding: 40px; border-radius: 20px; width: 90%; max-width: 420px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .close-modal { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        footer { text-align: center; padding: 25px; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--border-color); background: rgba(7, 10, 19, 0.8); margin-top: auto; z-index: 10; }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <nav>
        <div class="logo-container">
            <div class="logo"><i class="fa-solid fa-motorcycle"></i> Radar<span>Moto</span></div>
            <div class="nav-badge">christo.r7 le best</div>
        </div>
        <div class="auth-nav" id="auth-nav">
            <button class="nav-btn" id="btn-login-modal" onclick="openModal('auth-modal')"><i class="fa-solid fa-user"></i> Connexion</button>
            <div class="user-greeting" id="user-greeting">Salut, <span id="display-username"></span></div>
            <button class="nav-btn" id="btn-logout" style="display: none;" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('auth-modal')"><i class="fa-solid fa-xmark"></i></button>
            <h2 id="auth-title" style="margin-bottom: 20px;">Connexion</h2>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Nom d'utilisateur" required style="width:150%; margin-bottom:15px; padding:12px; background:rgba(0,0,0,0.3); border:1px solid #333; color:#fff; border-radius:8px;">
                <input type="password" id="auth-password" placeholder="Mot de passe" required style="width:100%; margin-bottom:15px; padding:12px; background:rgba(0,0,0,0.3); border:1px solid #333; color:#fff; border-radius:8px;">
                <button type="submit" class="submit-btn" style="width:100%; padding:12px;">Se connecter</button>
            </form>
        </div>
    </div>

    <section class="hero">
        <h1>Votre expert moto <span>intelligent</span></h1>
        <p>Analysez, simulez, comparez ou estimez la valeur de vente de votre moto sur LeBonCoin en quelques secondes.</p>

        <!-- NAVIGATION DES MODES -->
        <div class="main-modes">
            <button class="mode-btn active" id="btn-mode-ad" onclick="switchMode('ad')"><i class="fa-solid fa-magnifying-glass-dollar"></i> Analyseur</button>
            <button class="mode-btn" id="btn-mode-sim" onclick="switchMode('simulator')"><i class="fa-solid fa-user-gear"></i> Simulateur</button>
            <button class="mode-btn" id="btn-mode-duel" onclick="switchMode('duel')"><i class="fa-solid fa-scale-balanced"></i> Duel IA</button>
            <button class="mode-btn" id="btn-mode-argus" onclick="switchMode('argus')"><i class="fa-solid fa-tags"></i> Argus LeBonCoin</button>
        </div>

        <!-- 1. MODE ANNONCE -->
        <div class="search-container" id="container-mode-ad">
            <form id="analyze-form" class="search-box glass-panel">
                <input type="text" id="prompt" placeholder="Collez votre lien ou description LeBonCoin ici..." required>
                <button type="submit" id="submit-btn"><span>Lancer l'audit</span><div class="spinner" id="spinner"></div></button>
            </form>
        </div>

        <!-- 2. MODE SIMULATEUR -->
        <form id="simulator-form" class="simulator-form glass-panel">
            <div class="form-grid">
                <div class="form-group"><label><i class="fa-solid fa-cake-candles"></i> Tranche d'âge</label><select id="sim-age"><option value="25-35 ans">25-35 ans</option></select></div>
                <div class="form-group"><label><i class="fa-solid fa-wallet"></i> Budget maximum (€)</label><input type="number" id="sim-budget" value="6500" required></div>
            </div>
            <button type="submit" class="sim-submit-btn" id="sim-submit-btn"><span>Trouver ma moto idéale</span><div class="spinner" id="sim-spinner"></div></button>
        </form>

        <!-- 3. MODE DUEL -->
        <form id="duel-form" class="simulator-form glass-panel">
            <div class="form-grid">
                <div class="form-group"><label><i class="fa-solid fa-motorcycle"></i> Moto A</label><input type="text" id="duel-moto-1" placeholder="Ex: Yamaha MT-07" required></div>
                <div class="form-group"><label><i class="fa-solid fa-motorcycle"></i> Moto B</label><input type="text" id="duel-moto-2" placeholder="Ex: Kawasaki Z650" required></div>
                <div class="form-group"><label><i class="fa-solid fa-user-check"></i> Votre profil</label><input type="text" id="duel-profile" placeholder="Ex: Permis A2" required></div>
            </div>
            <button type="submit" class="sim-submit-btn" id="duel-submit-btn"><span>Lancer le Duel IA</span><div class="spinner" id="duel-spinner"></div></button>
        </form>

        <!-- 4. NOUVEAU MODE : ARGUS / ESTIMATION LEBONCOIN -->
        <form id="argus-form" class="simulator-form glass-panel">
            <div class="form-grid">
                <div class="form-group">
                    <label><i class="fa-solid fa-industry"></i> Marque</label>
                    <input type="text" id="argus-brand" placeholder="Ex: Yamaha, Honda, Kawasaki..." required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-motorcycle"></i> Modèle</label>
                    <input type="text" id="argus-model" placeholder="Ex: MT-07, CB650R, Z900..." required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-days"></i> Année de mise en circulation</label>
                    <input type="number" id="argus-year" placeholder="Ex: 2021" min="1950" max="2026" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-road"></i> Nombre de kilomètres</label>
                    <input type="number" id="argus-km" placeholder="Ex: 15400" min="0" step="100" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-file-invoice-dollar"></i> Historique d'entretien / Factures</label>
                    <select id="argus-invoice">
                        <option value="Factures complètes et carnet d'entretien à jour (Réseau constructeur)">Factures complètes & carnet à jour (Garage)</option>
                        <option value="Factures partielles / Entretien fait soi-même avec factures consommables">Factures partielles / Suivi sérieux</option>
                        <option value="Aucune facture / Pas de carnet d'entretien disponible">Aucune facture / Pas de carnet d'entretien</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="sim-submit-btn" id="argus-submit-btn">
                <span>Estimer le prix de vente</span>
                <div class="spinner" id="argus-spinner"></div>
            </button>
        </form>

        <!-- CONTENEURS DE RÉSULTATS -->
        <div class="result-container glass-panel" id="result-container">
            <div class="tabs-header"><button class="tab-btn active">Résumé Rapide</button></div>
            <div id="tab-summary" class="tab-content active"></div>
        </div>

        <div class="simulator-result glass-panel" id="simulator-result-container">
            <div class="tabs-header"><button class="tab-btn active">Moto Idéale</button></div>
            <div id="sim-tab-summary" class="tab-content active"></div>
        </div>

        <div class="duel-results-wrapper" id="duel-results-wrapper">
            <div class="duel-result glass-panel"><div class="tabs-header"><span class="tab-btn active">Moto A</span></div><div id="duel-content-1" class="tab-content active"></div></div>
            <div class="duel-result glass-panel"><div class="tabs-header"><span class="tab-btn active">Moto B</span></div><div id="duel-content-2" class="tab-content active"></div></div>
        </div>

        <!-- RÉSULTAT ARGUS -->
        <div class="argus-result glass-panel" id="argus-result-container">
            <div class="tabs-header" style="background: rgba(255, 179, 0, 0.1);">
                <span class="tab-btn active" style="cursor: default;"><i class="fa-solid fa-chart-line"></i> Estimation du prix sur LeBonCoin</span>
            </div>
            <div id="argus-content" class="tab-content active"></div>
        </div>
    </section>

    <footer>&copy; 2026 RadarMoto. Outil d'aide à l'achat propulsé par l'IA.</footer>

    <script>
        let currentUser = localStorage.getItem('currentUser');
        if(currentUser) { document.getElementById('btn-login-modal').style.display='none'; document.getElementById('user-greeting').style.display='inline-block'; document.getElementById('display-username').textContent=currentUser; document.getElementById('btn-logout').style.display='inline-block'; }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function logout() { localStorage.removeItem('currentUser'); location.reload(); }

        document.getElementById('auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('auth-username').value.trim();
            if(user) { localStorage.setItem('currentUser', user); location.reload(); }
        });

        function switchMode(mode) {
            ['container-mode-ad', 'simulator-form', 'duel-form', 'argus-form'].forEach(id => document.getElementById(id).style.display = 'none');
            ['result-container', 'simulator-result-container', 'duel-results-wrapper', 'argus-result-container'].forEach(id => document.getElementById(id).style.display = 'none');
            ['btn-mode-ad', 'btn-mode-sim', 'btn-mode-duel', 'btn-mode-argus'].forEach(id => document.getElementById(id).classList.remove('active'));

            if (mode === 'ad') { document.getElementById('btn-mode-ad').classList.add('active'); document.getElementById('container-mode-ad').style.display = 'block'; }
            else if (mode === 'simulator') { document.getElementById('btn-mode-sim').classList.add('active'); document.getElementById('simulator-form').style.display = 'block'; }
            else if (mode === 'duel') { document.getElementById('btn-mode-duel').classList.add('active'); document.getElementById('duel-form').style.display = 'block'; }
            else if (mode === 'argus') { document.getElementById('btn-mode-argus').classList.add('active'); document.getElementById('argus-form').style.display = 'block'; }
        }

        // Script Formulaire Argus
        document.getElementById('argus-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const brand = document.getElementById('argus-brand').value;
            const model = document.getElementById('argus-model').value;
            const year = document.getElementById('argus-year').value;
            const km = document.getElementById('argus-km').value;
            const invoice = document.getElementById('argus-invoice').value;

            const btn = document.getElementById('argus-submit-btn');
            const spinner = document.getElementById('argus-spinner');
            const resultBox = document.getElementById('argus-result-container');

            btn.disabled = true; spinner.style.display = 'inline-block'; resultBox.style.display = 'none';
            btn.querySelector('span').textContent = "Calcul de l'argus en cours...";

            try {
                const response = await fetch('/api/argus', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brand, model, year, km, invoice })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erreur serveur.');

                document.getElementById('argus-content').textContent = data.result || "Estimation indisponible.";
                resultBox.style.display = 'block';
                resultBox.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                alert("Erreur : " + error.message);
            } finally {
                btn.disabled = false; btn.querySelector('span').textContent = "Estimer le prix de vente"; spinner.style.display = 'none';
            }
        });

        // Script Analyze simple (Gabarit)
        document.getElementById('analyze-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const prompt = document.getElementById('prompt').value;
            const btn = document.getElementById('submit-btn'); const spinner = document.getElementById('spinner');
            btn.disabled = true; spinner.style.display = 'inline-block';
            try {
                const res = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
                const data = await res.json();
                document.getElementById('tab-summary').textContent = data.result;
                document.getElementById('result-container').style.display = 'block';
            } catch(err) { alert(err); } finally { btn.disabled = false; spinner.style.display = 'none'; }
        });

        // Script Simulateur
        document.getElementById('simulator-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('sim-submit-btn'); const spinner = document.getElementById('sim-spinner');
            btn.disabled = true; spinner.style.display = 'inline-block';
            try {
                const res = await fetch('/api/simulate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile: { budget: document.getElementById('sim-budget').value } }) });
                const data = await res.json();
                document.getElementById('sim-tab-summary').textContent = data.result;
                document.getElementById('simulator-result-container').style.display = 'block';
            } catch(err) { alert(err); } finally { btn.disabled = false; spinner.style.display = 'none'; }
        });

        // Script Duel
        document.getElementById('duel-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('duel-submit-btn'); const spinner = document.getElementById('duel-spinner');
            btn.disabled = true; spinner.style.display = 'inline-block';
            try {
                const res = await fetch('/api/duel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ moto1: document.getElementById('duel-moto-1').value, moto2: document.getElementById('duel-moto-2').value, profile: document.getElementById('duel-profile').value }) });
                const data = await res.json();
                document.getElementById('duel-content-1').textContent = data.resultMoto1;
                document.getElementById('duel-content-2').textContent = data.resultMoto2;
                document.getElementById('duel-results-wrapper').style.display = 'flex';
            } catch(err) { alert(err); } finally { btn.disabled = false; spinner.style.display = 'none'; }
        });
    </script>
</body>
</html>

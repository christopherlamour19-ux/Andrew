<style>
    :root {
        --bg-dark: #0B0F19;
        --bg-card: #151C2C;
        --accent: #FFB300;
        --accent-hover: #FFA000;
        --text-main: #FFFFFF;
        --text-muted: #94A3B8;
        --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 5%;
        background: rgba(11, 15, 25, 0.85);
        backdrop-filter: blur(15px);
        position: fixed;
        width: 100%;
        z-index: 100;
        border-bottom: 1px solid var(--border-color);
    }

    .logo {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
    }

    .logo i { color: var(--accent); }
    .logo span { color: var(--accent); }

    .nav-right {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .nav-badge {
        background: rgba(255, 179, 0, 0.1);
        color: var(--accent);
        border: 1px solid rgba(255, 179, 0, 0.3);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
    }

    .auth-nav-btn {
        background: var(--accent);
        color: var(--bg-dark);
        border: none;
        padding: 8px 16px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background 0.3s;
    }
    .auth-nav-btn:hover { background: var(--accent-hover); }

    .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 100px 5% 40px 5%;
        background: radial-gradient(circle at 50% 25%, rgba(255, 179, 0, 0.06), transparent 60%);
        min-height: calc(100vh - 70px);
        margin-top: 70px;
    }

    .hero h1 {
        font-size: 3.2rem;
        font-weight: 800;
        margin-bottom: 15px;
        letter-spacing: -1px;
        line-height: 1.2;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
        font-size: 1.15rem;
        color: var(--text-muted);
        margin-bottom: 25px;
        max-width: 650px;
    }

    .main-modes {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 30px;
    }

    .mode-btn {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 12px 25px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .mode-btn.active {
        background: var(--accent);
        color: var(--bg-dark);
        border-color: var(--accent);
    }

    .search-container, .simulator-form, .auth-container, .dashboard-container {
        width: 100%;
        max-width: 750px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 30px;
        text-align: left;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        margin: 0 auto;
        display: none;
    }

    .search-container {
        background: transparent;
        border: none;
        padding: 0;
        box-shadow: none;
    }

    .search-box {
        display: flex;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        backdrop-filter: blur(20px);
        padding: 8px;
        border-radius: 14px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        transition: border-color 0.3s;
    }

    .search-box:focus-within { border-color: var(--accent); }

    .search-box input {
        flex: 1;
        background: transparent;
        border: none;
        padding: 15px 20px;
        color: white;
        font-size: 1rem;
        outline: none;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .search-box button, .auth-submit-btn {
        background: var(--accent);
        color: var(--bg-dark);
        border: none;
        padding: 0 35px;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .auth-submit-btn { width: 100%; padding: 15px; margin-top: 10px; }
    .search-box button:hover, .auth-submit-btn:hover { background: var(--accent-hover); }

    .form-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 25px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 0.9rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    .form-group select, .form-group input {
        background: rgba(11, 15, 25, 0.8);
        border: 1px solid var(--border-color);
        padding: 12px 15px;
        border-radius: 10px;
        color: white;
        font-size: 0.95rem;
        outline: none;
        width: 100%;
    }

    .form-group select:focus, .form-group input:focus { border-color: var(--accent); }

    .sim-submit-btn {
        width: 100%;
        background: var(--accent);
        color: var(--bg-dark);
        border: none;
        padding: 15px;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .sim-submit-btn:hover { background: var(--accent-hover); }

    .sample-hint {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-top: 15px;
        text-align: center;
    }

    .sample-hint span {
        color: var(--accent);
        cursor: pointer;
        text-decoration: underline;
        font-weight: 500;
    }

    .result-container, .simulator-result {
        width: 100%;
        max-width: 750px;
        display: none;
        text-align: left;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        margin: 0 auto;
        overflow: hidden;
    }

    .tabs-header {
        display: flex;
        background: rgba(11, 15, 25, 0.6);
        border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
        flex: 1;
        padding: 15px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .tab-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.02); }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: rgba(255, 179, 0, 0.03); }

    .tab-content {
        display: none;
        padding: 25px;
        color: #E2E8F0;
        line-height: 1.8;
        font-size: 0.95rem;
        white-space: pre-wrap;
    }

    .tab-content.active { display: block; }

    .moto-preview-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-bottom: 1px solid var(--border-color);
    }

    .error-box { border-color: rgba(239, 68, 68, 0.4) !important; }

    .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 3px solid rgba(11, 15, 25, 0.3);
        border-radius: 50%;
        border-top-color: var(--bg-dark);
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-switch {
        text-align: center;
        margin-top: 15px;
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    .auth-switch span {
        color: var(--accent);
        cursor: pointer;
        font-weight: 600;
        text-decoration: underline;
    }

    .history-item {
        background: rgba(11, 15, 25, 0.6);
        border: 1px solid var(--border-color);
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: border-color 0.3s;
    }
    .history-item:hover { border-color: var(--accent); }

    footer {
        text-align: center;
        padding: 20px;
        color: var(--text-muted);
        font-size: 0.85rem;
        border-top: 1px solid var(--border-color);
        background: rgba(11, 15, 25, 0.5);
    }

    @media (max-width: 768px) {
        .hero h1 { font-size: 2.2rem; }
        .search-box { flex-direction: column; background: transparent; border: none; box-shadow: none; }
        .search-box input { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 10px; padding: 15px; }
        .search-box button { width: 100%; padding: 15px; justify-content: center; }
        .main-modes { flex-direction: column; width: 100%; }
    }
</style>

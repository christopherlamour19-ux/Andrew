<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyseur d'Annonce Moto AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #1e293b; border-radius: 16px; padding: 32px; width: 100%; max-width: 650px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #38bdf8; text-align: center; }
    p.subtitle { color: #94a3b8; text-align: center; margin-bottom: 24px; font-size: 0.95rem; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: #cbd5e1; }
    textarea, input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    textarea:focus, input:focus { border-color: #38bdf8; }
    textarea { resize: vertical; height: 100px; }
    button { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; font-weight: 700; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0284c7; color: #fff; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #result { margin-top: 24px; padding: 20px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; display: none; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; }
    .loader { text-align: center; color: #38bdf8; margin-top: 16px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🏍️ MotoCheck AI</h1>
    <p class="subtitle">Colle le texte ou les détails de l'annonce LeBonCoin pour lancer l'analyse.</p>
    
    <div class="form-group">
      <label for="adData">Texte de l'annonce (Titre, Prix, Année, km, Description) :</label>
      <textarea id="adData" placeholder="Ex: Yamaha MT-07 2018 - 4500€ - 25000 km. Vends moto en bon état, révision faite..."></textarea>
    </div>

    <button id="btn" onclick="analyserAnnonce()">Lancer l'analyse IA</button>
    <div id="loader" class="loader">Analyse en cours par l'IA...</div>
    <div id="result"></div>
  </div>

  <script>
    async function analyserAnnonce() {
      const text = document.getElementById('adData').value;
      const resultDiv = document.getElementById('result');
      const loader = document.getElementById('loader');
      const btn = document.getElementById('btn');

      if (!text.trim()) {
        alert("Pense à coller le texte de l'annonce !");
        return;
      }

      btn.disabled = true;
      loader.style.display = 'block';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();
        resultDiv.textContent = data.result || data.error;
        resultDiv.style.display = 'block';
      } catch (err) {
        resultDiv.textContent = "Erreur lors de l'analyse.";
        resultDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    }
  </script>
</body>
</html>
